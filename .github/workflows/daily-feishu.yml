name: Daily astronomy brief to Feishu

on:
  push:
    paths:
      - 'daily/**/*.md'

permissions:
  contents: read

jobs:
  notify-feishu:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newly added Shanghai-today daily brief
        id: select
        shell: bash
        run: |
          set -euo pipefail

          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.sha }}'
          ZERO_SHA='0000000000000000000000000000000000000000'
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          EXPECTED="daily/${TODAY:0:7}/${TODAY}.md"

          echo "Asia/Shanghai today: ${TODAY}"
          echo "Expected daily file: ${EXPECTED}"

          if [[ -z "${BEFORE}" || "${BEFORE}" == "${ZERO_SHA}" ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable push base; inspecting the pushed root/HEAD commit safely."
            mapfile -t ADDED_FILES < <(
              git diff-tree --root --no-commit-id --name-status -r "${HEAD}" \
                | awk '$1 == "A" {print $2}'
            )
          else
            mapfile -t ADDED_FILES < <(
              git diff --name-status "${BEFORE}" "${HEAD}" \
                | awk '$1 == "A" {print $2}'
            )
          fi

          MATCH=''
          for FILE in "${ADDED_FILES[@]:-}"; do
            [[ -n "${FILE}" ]] || continue
            echo "Added file: ${FILE}"
            if [[ "${FILE}" == "${EXPECTED}" ]]; then
              MATCH="${FILE}"
              break
            fi
          done

          if [[ -z "${MATCH}" ]]; then
            echo "No newly added daily Markdown for Asia/Shanghai today; exiting normally."
            echo "should_send=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! "${MATCH}" =~ ^daily/[0-9]{4}-[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]]; then
            echo "Matched path failed daily archive format validation; exiting normally."
            echo "should_send=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! -f "${MATCH}" ]]; then
            echo "Matched file is absent from the checked-out tree; exiting normally."
            echo "should_send=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          RELATIVE="${MATCH#daily/}"
          echo "file=${MATCH}" >> "${GITHUB_OUTPUT}"
          echo "relative_file=${RELATIVE}" >> "${GITHUB_OUTPUT}"
          echo "should_send=true" >> "${GITHUB_OUTPUT}"

      - name: Verify Feishu webhook secret
        if: steps.select.outputs.should_send == 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FEISHU_WEBHOOK:-}" ]]; then
            echo '::error::FEISHU_WEBHOOK repository secret is not configured.'
            exit 1
          fi

      - name: Send compact Feishu card
        if: steps.select.outputs.should_send == 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPORT_URL: https://github.com/RickWashon/astrophysics-daily-report/blob/main/daily/${{ steps.select.outputs.relative_file }}
        run: python scripts/send_feishu.py '${{ steps.select.outputs.file }}'
